<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shard Burst</title>
<style>
  html { background: #060608; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; opacity: 0; transition: opacity 0.6s; }
  body.ready canvas { opacity: 1; }
  /* Host-only controls the brief puts on the page: the accent picker. Everything else is Rive. */
  #controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center;
              font: 11px/1 ui-monospace, Menlo, monospace; color: #8c8c94; opacity: 0.25; transition: opacity 0.3s; }
  #controls:hover { opacity: 1; }
  #controls input { width: 28px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; }
  #status { position: fixed; left: 16px; bottom: 16px; font: 12px ui-monospace, Menlo, monospace; color: #c66; }
</style>
<script src="https://unpkg.com/@rive-app/webgl2@2.49.1/rive.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="controls" title="space play/pause · F form · T theme · Q tier · D debug">
  <span>accent</span><input id="accent" type="color" value="#a80f16" aria-label="Accent colour">
</div>
<div id="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
